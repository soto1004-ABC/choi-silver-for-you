name: Withdraw public game download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/withdraw-public-download.yml']
permissions:
  contents: write
jobs:
  withdraw:
    if: github.repository == 'soto1004-ABC/choi-silver-for-you'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Preserve V1.0 and its APK as an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH repos/soto1004-ABC/choi-silver-for-you/releases/444270747 -F draft=true -f make_latest=false > "$RUNNER_TEMP/withdrawn-release.json"
          jq -e '.id == 444270747 and .tag_name == "v1.0.0" and .draft == true and (.assets | length) == 1 and .assets[0].name == "ExplosionIsArt-V1.0-local.apk"' "$RUNNER_TEMP/withdrawn-release.json"
          echo "Public release is now an unpublished draft; APK retained."
